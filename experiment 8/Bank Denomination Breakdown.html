<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Denomination Breakdown</title>
<script>
function showDenominations() {
  let amount = parseInt(prompt("Enter the amount in Rs:"));
  let denominations = [100, 50, 20, 10, 5, 2, 1];
  let result = "<h3>Denomination Breakdown</h3>";

  denominations.forEach((denom) => {
    let count = Math.floor(amount / denom);
    if (count > 0) {
      result += `${count} × Rs.${denom}<br>`;
      amount %= denom;
    }
  });

  document.getElementById("denoResult").innerHTML = result;
}
</script>
</head>
<body>
  <h2>Bank Denomination Breakdown</h2>
  <button onclick="showDenominations()">Calculate Denominations</button>
  <div id="denoResult"></div>
</body>
</html>
