<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Window Object Example</title>
<script>
function showWindowInfo() {
  let width = window.innerWidth;
  let height = window.innerHeight;
  alert("Window Width: " + width + ", Height: " + height);
}

function openNewWindow() {
  window.open("https://www.example.com", "_blank", "width=400,height=300");
}
</script>
</head>
<body>
  <h2>Window Object Properties & Methods</h2>
  <button onclick="showWindowInfo()">Show Window Size</button>
  <button onclick="openNewWindow()">Open New Window</button>
</body>
</html>
