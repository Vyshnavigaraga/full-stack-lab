<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks in HTML</title>
</head>
<body>
    <h1>Hyperlinks using &lt;a&gt; tag</h1>

    <p>Click the links below:</p>

    <!-- Link opening in same tab -->
    <a href="https://www.google.com">Go to Google (same tab)</a><br><br>

    <!-- Link opening in a new tab -->
    <a href="https://www.wikipedia.org" target="_blank">Go to Wikipedia (new tab)</a><br><br>

    <!-- Link opening in a new window (some browsers treat _blank as new tab) -->
    <a href="https://www.openai.com" target="_blank">Go to OpenAI (new tab/window)</a>
</body>
</html>
