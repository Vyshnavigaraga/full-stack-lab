<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voter Eligibility Check</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
  table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 50%;
  }
  th, td {
    border: 1px solid #333;
    padding: 10px;
    text-align: center;
  }
  th {
    background-color: #3498db;
    color: white;
  }
</style>

<script>
  function voterCheck() {
    let name = prompt("Enter your name:");
    let age = prompt("Enter your age:");

    // Type conversion: convert age from string to number
    age = Number(age);

    // Determine eligibility
    let eligibility = (age >= 18) ? "Eligible to Vote" : "Not Eligible to Vote";

    // Display results in table
    document.getElementById("output").innerHTML = `
      <table>
        <tr><th>Name</th><th>Age</th><th>Eligibility</th></tr>
        <tr><td>${name}</td><td>${age}</td><td>${eligibility}</td></tr>
      </table>
    `;
  }
</script>
</head>
<body>
  <h2>Voter Eligibility Program</h2>
  <button onclick="voterCheck()">Check Voter Eligibility</button>
  <div id="output"></div>
</body>
</html>
