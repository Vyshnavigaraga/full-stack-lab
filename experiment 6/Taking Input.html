<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JavaScript Input Methods</title>
<script>
  function getInputs() {
    // 1. Using prompt()
    let name = prompt("Enter your name:");

    // 2. Using HTML input fields
    let number = document.getElementById("numInput").value;

    // 3. Type Conversion Example
    let convertedNumber = Number(number); // convert string to number

    alert("Hello " + name + "! You entered number: " + convertedNumber);
  }
</script>
</head>
<body>
  <h2>JavaScript Input Methods</h2>
  <p>Enter a number: <input type="text" id="numInput"></p>
  <button onclick="getInputs()">Submit</button>
</body>
</html>
