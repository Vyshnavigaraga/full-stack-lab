<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Box Model Example</title>
<style>
  .box {
    width: 300px;
    background-color: lightyellow;
    border: 5px solid orange;    /* Border */
    padding: 20px;               /* Padding */
    margin: 30px auto;           /* Margin */
    text-align: center;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
  }
</style>
</head>
<body>
  <h2 style="text-align:center;">CSS Box Model Demonstration</h2>
  <div class="box">
    <strong>Content:</strong> This is the text inside the box.<br>
    <strong>Padding:</strong> Space between content and border.<br>
    <strong>Border:</strong> Orange line around the box.<br>
    <strong>Margin:</strong> Space outside the border.
  </div>
</body>
</html>
