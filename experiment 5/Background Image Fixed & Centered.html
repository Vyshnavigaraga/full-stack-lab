<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Background Image Positioning</title>
<style>
  body {
    height: 200vh; /* Make page scrollable */
    background-image: url('https://via.placeholder.com/600x400');
    background-repeat: no-repeat;
    background-position: center 50%; /* halfway down, horizontally centered */
    background-attachment: fixed; /* stays in place when scrolling */
    background-size: 400px auto; /* resize for visibility */
  }

  h2 {
    text-align: center;
    margin-top: 50px;
  }
</style>
</head>
<body>
  <h2>Fixed Background Image (Centered Horizontally, Halfway Down)</h2>
</body>
</html>
