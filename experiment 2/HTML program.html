<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Working of Tables</title>
</head>
<body>
    <h1>Working of Tables in HTML</h1>

    <table border="2" cellpadding="10" cellspacing="0">
        <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td rowspan="2">Fruits</td>
            <td>Apple</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>20</td>
        </tr>
        <tr>
            <td colspan="2">Total Quantity</td>
            <td>30</td>
        </tr>
    </table>
</body>
</html>
