<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic HTML Example</title>
    <style>
        header, footer {
            background-color: #eee;
            padding: 10px;
            text-align: center;
        }
        nav {
            background-color: #ddd;
            padding: 10px;
        }
        section {
            padding: 10px;
        }
        aside {
            background-color: #f0f0f0;
            padding: 10px;
            float: right;
            width: 25%;
        }
        article {
            margin-right: 30%;
        }
        figure {
            margin: 10px;
        }
        figcaption {
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Blog</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">Articles</a> |
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <article>
                <h2>Using Semantic Tags</h2>
                <p>This is an <span style="color: blue;">example</span> of a semantic HTML layout using modern tags.</p>

                <figure>
                    <img src="https://via.placeholder.com/150" alt="Placeholder Image">
                    <figcaption>Sample image with caption</figcaption>
                </figure>
            </article>
        </section>

        <aside>
            <h3>Sidebar</h3>
            <p>Additional content like ads or links can go here.</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>

</body>
</html>
